name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Several test suites read the seeded scout.sqlite, so build it first
      - name: Seed database
        run: bun run scout

      - name: Test
        run: bun test

      - name: Build
        run: bun build src/index.ts src/cli.ts --target=bun --outdir dist
